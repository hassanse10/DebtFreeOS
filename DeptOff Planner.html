<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DebtFreeOS — Interactive Demo</title>
<style>
/* ================= DEMO MODE ================= */
body::before{
  content:"INTERACTIVE DEMO • SAMPLE DATA ONLY • CHANGES ARE NOT SAVED";
  display:block;position:sticky;top:0;z-index:300;
  text-align:center;padding:8px 12px;background:#0E7A54;color:#fff;
  font-size:12px;font-weight:700;letter-spacing:.04em
}
.demo-note{
  margin-bottom:16px;padding:12px 15px;border:1px solid var(--border);
  border-left:4px solid var(--accent);border-radius:var(--r-sm);
  background:var(--accent-50);color:var(--ink)
}
.demo-note strong{display:block;margin-bottom:2px}
.demo-note span{font-size:12.5px;color:var(--ink-2)}
/* ================= DESIGN TOKENS ================= */
:root{
  --ink:#0B1B2B; --ink-2:#4A5C6E; --ink-3:#8496A6;
  --primary:#0E7A54; --primary-700:#0A5C3F; --primary-50:#E4F2EC;
  --accent:#E09B2D; --accent-50:#FBEFDA;
  --ok:#15A05F; --warn:#E0912D; --danger:#D2453C; --info:#2A6FB0;
  --bg:#F5F8F6; --surface:#FFFFFF; --surface-2:#EDF2EF; --border:#E0E8E3;
  --shadow:0 1px 2px rgba(11,27,43,.04),0 8px 24px rgba(11,27,43,.06);
  --shadow-lg:0 4px 12px rgba(11,27,43,.07),0 20px 48px rgba(11,27,43,.12);
  --r:16px; --r-sm:10px;
  --f-display:'Space Grotesk','Poppins','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter','Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-num:'IBM Plex Mono','DejaVu Sans Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
html[data-theme="dark"]{
  --ink:#E8EFF3; --ink-2:#9DB0BF; --ink-3:#677C8C;
  --primary:#28A374; --primary-700:#1B7A55; --primary-50:#102A22;
  --accent:#E9AE4E; --accent-50:#2C2213;
  --bg:#0A141D; --surface:#111F2B; --surface-2:#182A38; --border:#22394A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 14px rgba(0,0,0,.45),0 22px 50px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
::selection{background:var(--primary);color:#fff}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.4px}

/* ================= LAYOUT ================= */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 22px}
.brand .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--primary),var(--primary-700));display:grid;place-items:center;flex-shrink:0;box-shadow:0 6px 14px rgba(14,122,84,.3)}
.brand .mk svg{width:21px;height:21px}
.brand .nm{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.5px}
.brand .nm em{font-style:normal;color:var(--accent)}
.navsec{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);padding:15px 12px 5px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink-2);border:none;background:none;width:100%;text-align:left;font-size:13.5px;font-weight:500;transition:background .15s,color .15s}
.nav svg{width:17px;height:17px;flex-shrink:0;opacity:.8}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--primary-50);color:var(--primary);font-weight:600}
.nav.on svg{opacity:1}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:13px 26px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.searchbtn{display:flex;align-items:center;gap:9px;flex:1;max-width:400px;padding:9px 14px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-3);font-size:13.5px}
.searchbtn:hover{border-color:var(--primary);color:var(--ink-2)}
.searchbtn svg{width:15px;height:15px}
.searchbtn kbd{margin-left:auto;font-family:var(--f-num);font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--ink-3)}
.tact{display:flex;gap:8px;margin-left:auto}
.ib{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;transition:all .15s}
.ib:hover{border-color:var(--primary);color:var(--primary)}
.ib svg{width:16px;height:16px}
.wrap{padding:24px 26px 64px;max-width:1440px;width:100%;margin:0 auto}
.page{display:none;animation:in .22s ease}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.7px}
.head p{color:var(--ink-2);margin-top:2px;font-size:13.5px}
.hact{display:flex;gap:8px;flex-wrap:wrap}

/* ================= BUTTONS ================= */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:13.5px;transition:all .15s;text-decoration:none;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-700);transform:translateY(-1px);box-shadow:0 6px 16px rgba(14,122,84,.28)}
.btn-a{background:var(--accent);color:#3A2708}
.btn-a:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(224,155,45,.32)}
.btn-g{background:var(--surface);border-color:var(--border);color:var(--ink-2)}
.btn-g:hover{border-color:var(--primary);color:var(--primary)}
.btn-d{background:var(--danger);color:#fff}
.btn-d:hover{filter:brightness(.93)}
.btn-sm{padding:6px 11px;font-size:12.5px}

/* ================= CARDS / GRID ================= */
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.hv{transition:transform .2s,box-shadow .2s}
.card.hv:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ct h3{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-2);font-weight:700}
.ci{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.ci svg{width:15px;height:15px}
.sv{font-family:var(--f-num);font-size:25px;font-weight:600;letter-spacing:-1px}
.ss{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.up{color:var(--ok);font-weight:600} .down{color:var(--danger);font-weight:600}
h2.sec{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.4px;margin:26px 0 13px}

/* ================= SIGNATURE: FINISH LINE ================= */
.finish{background:linear-gradient(135deg,var(--primary-700) 0%,var(--primary) 55%,#12906A 100%);border-radius:20px;color:#fff;padding:26px 28px;position:relative;overflow:hidden}
.finish::after{content:"";position:absolute;right:-40px;bottom:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(224,155,45,.4),transparent 68%)}
.finish .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.18em;opacity:.82;font-weight:700;position:relative}
.finish .date{font-family:var(--f-display);font-size:42px;font-weight:700;letter-spacing:-1.4px;margin:6px 0 2px;position:relative;line-height:1.05}
.finish .sub{font-size:13px;opacity:.85;position:relative}
.track{position:relative;margin-top:22px;height:52px}
.track .rail{position:absolute;left:0;right:0;top:20px;height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.track .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD79A,var(--accent));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.track .flag{position:absolute;top:0;transform:translateX(-50%);text-align:center;transition:left .9s cubic-bezier(.2,.8,.2,1)}
.track .flag .fg{width:26px;height:20px;margin:0 auto;border-radius:3px;
  background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,#111 25%,#111 75%,#fff 75%);
  background-size:10px 10px;background-position:0 0,5px 5px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.track .flag .pc{font-family:var(--f-num);font-size:12px;font-weight:700;margin-top:4px}
.track .ends{position:absolute;left:0;right:0;top:38px;display:flex;justify-content:space-between;font-size:10.5px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}

/* ================= PROGRESS / BADGES ================= */
.pr{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pr>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#22A97A);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pr.am>div{background:linear-gradient(90deg,#F0C273,var(--accent))}
.pr.rd>div{background:linear-gradient(90deg,#E88880,var(--danger))}
.bg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.bg-ok{background:rgba(21,160,95,.12);color:var(--ok)}
.bg-am{background:rgba(224,145,45,.14);color:#A8681A}
.bg-rd{background:rgba(210,69,60,.12);color:var(--danger)}
.bg-in{background:rgba(42,111,176,.12);color:var(--info)}
.bg-ac{background:var(--accent-50);color:#9A6714}
.bg-nt{background:var(--surface-2);color:var(--ink-2)}
html[data-theme="dark"] .bg-am{color:#EAB761} html[data-theme="dark"] .bg-ac{color:var(--accent)}

/* ================= TABLES ================= */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--surface-2);text-align:left;padding:10px 15px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:700;white-space:nowrap}
tbody td{padding:11px 15px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.ra{display:flex;gap:5px;justify-content:flex-end}
.ra button{border:none;background:none;width:28px;height:28px;border-radius:7px;color:var(--ink-3);display:grid;place-items:center}
.ra button:hover{background:var(--surface-2);color:var(--primary)}
.ra button.del:hover{color:var(--danger)}
.ra svg{width:14px;height:14px}

/* ================= FORMS ================= */
.fd{margin-bottom:13px}
.fd label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fd input,.fd select,.fd textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);outline:none;transition:border .15s,box-shadow .15s}
.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,122,84,.13)}
.fd .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.fd.bad input,.fd.bad select{border-color:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ================= MODAL / TOAST ================= */
.ov{position:fixed;inset:0;background:rgba(11,27,43,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.on{display:flex}
.md{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;animation:mi .2s cubic-bezier(.2,.8,.2,1)}
@keyframes mi{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.mh{padding:20px 22px 0} .mh h2{font-family:var(--f-display);font-size:19px;letter-spacing:-.4px}
.mh p{color:var(--ink-2);font-size:13px;margin-top:4px}
.mb{padding:16px 22px} .mf{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.ts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:9px;z-index:200}
.t{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);padding:11px 15px;min-width:250px;max-width:350px;animation:ti .25s cubic-bezier(.2,.8,.2,1);font-size:13.5px}
.t strong{display:block;font-size:13px;margin-bottom:2px}
.t.ok{border-left-color:var(--ok)} .t.wn{border-left-color:var(--warn)}
.t.er{border-left-color:var(--danger)} .t.if{border-left-color:var(--info)}
@keyframes ti{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.t.out{opacity:0;transform:translateX(20px);transition:all .25s}

/* ================= SEARCH PALETTE ================= */
.sp{position:fixed;inset:0;background:rgba(11,27,43,.5);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:flex-start;padding-top:14vh;z-index:150}
.sp.on{display:flex}
.spb{width:100%;max-width:560px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden}
.spb input{width:100%;padding:17px 20px;border:none;border-bottom:1px solid var(--border);background:var(--surface);font-size:16px;outline:none}
.spr{max-height:360px;overflow-y:auto}
.spi{padding:11px 20px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid var(--border)}
.spi:hover,.spi.sel{background:var(--surface-2)}
.spt{font-size:10.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.07em;align-self:center}

/* ================= EMPTY / MISC ================= */
.mt{text-align:center;padding:44px 20px;color:var(--ink-2)}
.mt .art{width:64px;height:64px;margin:0 auto 13px;border-radius:19px;background:var(--surface-2);display:grid;place-items:center}
.mt .art svg{width:28px;height:28px;color:var(--ink-3)}
.mt h4{font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:5px}
.mt p{font-size:13px;max-width:330px;margin:0 auto 15px}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
.tabs button{border:none;background:none;padding:6px 15px;border-radius:99px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.tabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.cv{width:100%;display:block}
.lg{display:flex;flex-wrap:wrap;gap:9px 15px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mu{color:var(--ink-3);font-size:12.5px}
.dv{height:1px;background:var(--border);margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.coach{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.coach:last-child{border-bottom:none;padding-bottom:0}
.coach .dt{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.coach h5{font-size:13.5px;margin-bottom:2px} .coach p{font-size:12.5px;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:5px 0}
.day{min-height:80px;border:1px solid var(--border);border-radius:11px;padding:6px 7px;background:var(--surface);font-size:12px}
.day.oth{opacity:.32} .day.tdy{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-50)}
.day .dn{font-weight:700;font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.ev{border-radius:6px;padding:2px 6px;margin-bottom:3px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev-du{background:rgba(210,69,60,.13);color:var(--danger)}
.ev-so{background:rgba(224,145,45,.15);color:#A8681A}
.ev-pd{background:rgba(21,160,95,.13);color:var(--ok)}
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:13px}
.mi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px;text-align:center;transition:transform .2s}
.mi.got{border-color:var(--accent);background:linear-gradient(180deg,var(--surface),var(--accent-50))}
.mi.got:hover{transform:translateY(-3px)}
.mi .md2{width:48px;height:48px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3)}
.mi.got .md2{background:linear-gradient(145deg,#F3C878,var(--accent));color:#4A3208;box-shadow:0 6px 15px rgba(224,155,45,.4)}
.mi .md2 svg{width:22px;height:22px}
.mi h4{font-size:13px;margin-bottom:3px} .mi p{font-size:11.5px;color:var(--ink-3)}
.mi.no{opacity:.55;filter:grayscale(.4)}
.warnbox{background:rgba(210,69,60,.08);border:1px solid rgba(210,69,60,.25);border-radius:var(--r-sm);padding:11px 14px;font-size:13px;color:var(--danger);margin-bottom:14px}
.disc{font-size:11.5px;color:var(--ink-3);line-height:1.5}
@media print{.side,.top,.hact,.no-print{display:none!important}.app{grid-template-columns:1fr}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
@media (max-width:1199px){.app{grid-template-columns:72px 1fr}.brand .nm,.nav span,.navsec{display:none}.nav{justify-content:center;padding:11px}.g4,.g6{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:90;border-top:1px solid var(--border);border-right:none;padding:7px}.brand,.navsec{display:none}.wrap{padding:16px 14px 104px}.g2,.g3,.g4,.g6{grid-template-columns:1fr}.fr{grid-template-columns:1fr}.finish .date{font-size:32px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">
    <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4"/><path d="M4 5h13l-2.5 4L17 13H4"/></svg></div>
    <div class="nm">DebtFree<em>OS</em></div>
  </div>
  <div class="navsec">Overview</div>
  <button class="nav on" data-p="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>
  <button class="nav" data-p="debts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg><span>My Debts</span></button>
  <div class="navsec">Strategy</div>
  <button class="nav" data-p="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Payoff Plan</span></button>

<script>
"use strict";
/* ==========================================================
   DebtFreeOS — offline debt payoff planner
   No network. No account. Data stays on this device.
   Layers: utils -> storage -> engine -> ui -> pages
   ========================================================== */

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const todayISO=()=>new Date().toISOString().slice(0,10);
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthKey=d=>(d instanceof Date?d:new Date(d+"T12:00:00")).toISOString().slice(0,7);
const monthName=mk=>{const[y,m]=mk.split("-");return MON[+m-1]+" "+y};
const shiftMonth=(mk,n)=>{const[y,m]=mk.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const daysInMonth=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate()};
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
function fmt(n,dec=0){const v=(+n||0).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:Math.max(dec,2)});return S.settings.currency+v}
function fmtDate(iso){if(!iso)return"—";const d=new Date(iso+"T12:00:00");if(isNaN(d))return iso;
  const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=d.getFullYear();
  return S.settings.dateFormat==="DMY"?dd+"/"+mm+"/"+yy:S.settings.dateFormat==="YMD"?yy+"-"+mm+"-"+dd:mm+"/"+dd+"/"+yy}
const compact=n=>{n=+n||0;const a=Math.abs(n);return(n<0?"-":"")+(a>=1e6?(a/1e6).toFixed(1)+"M":a>=1e3?(a/1e3).toFixed(1)+"k":a.toFixed(0))};
const DEBT_TYPES=["Credit Card","Personal Loan","Auto Loan","Student Loan","Medical Debt","Mortgage","BNPL","Line of Credit","Family / Personal","Other"];
const TYPE_COLOR={"Credit Card":"#D2453C","Personal Loan":"#2A6FB0","Auto Loan":"#0E7A54","Student Loan":"#7C4DBE","Medical Debt":"#C2508A","Mortgage":"#1F7F86","BNPL":"#E09B2D","Line of Credit":"#5B6B7A","Family / Personal":"#4E8A3C","Other":"#8496A6"};
const tcolor=t=>TYPE_COLOR[t]||"#8496A6";

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const DEMO_MODE=true;
const DB_NAME="debtfreeos", STORE="state", LS_KEY="debtfreeos.v1";
const blank=()=>({
  version:1,
  settings:{currency:"$",dateFormat:"MDY",theme:"light",weekStart:0,strategy:"avalanche",extraMonthly:0,onboarded:false,demo:false,lastBackup:null},
  debts:[],payments:[],scenarios:[],milestones:{},preferences:{}
});
let S=blank(), _db=null, _useIDB=false;
function openDB(){return new Promise(res=>{
  if(!("indexedDB"in window))return res(null);
  let req;try{req=indexedDB.open(DB_NAME,1)}catch(e){return res(null)}
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};
  req.onsuccess=()=>res(req.result); req.onerror=()=>res(null);
  setTimeout(()=>res(req.result||null),1200);
})}
function idbGet(){return new Promise(res=>{
  try{const tx=_db.transaction(STORE,"readonly").objectStore(STORE).get("root");
    tx.onsuccess=()=>res(tx.result||null);tx.onerror=()=>res(null)}catch(e){res(null)}})}
function idbPut(v){return new Promise(res=>{
  try{const tx=_db.transaction(STORE,"readwrite").objectStore(STORE).put(v,"root");
    tx.onsuccess=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
function merge(raw){return Object.assign(blank(),raw,{settings:Object.assign(blank().settings,(raw&&raw.settings)||{})})}
async function loadState(){
  if(DEMO_MODE){S=blank();_db=null;_useIDB=false;return}
  _db=await openDB(); _useIDB=!!_db;
  if(_useIDB){const v=await idbGet();if(v){S=merge(v);return}}
  try{const raw=localStorage.getItem(LS_KEY);if(raw)S=merge(JSON.parse(raw))}catch(e){console.warn("recovering from unreadable data",e)}
}
async function persist(){
  if(DEMO_MODE)return;
  try{
    if(_useIDB){const ok=await idbPut(S);if(ok)return}
    localStorage.setItem(LS_KEY,JSON.stringify(S));
  }catch(e){toast("Storage is full","Export a backup, then remove older payments to free space.","er")}
}
const save=debounce(()=>{persist()},160);

/* ==========================================================
   PAYOFF ENGINE — deterministic, testable, UI-free
   ========================================================== */
const MAX_MONTHS=600;
function activeDebts(list){return (list||S.debts).filter(d=>d.active!==false&&(+d.balance||0)>0)}
function basePayment(d){const min=+d.minPayment||0,pl=+d.plannedPayment||0;return Math.max(min,pl)}
function orderDebts(list,strategy){
  const bal=d=>d.balance!==undefined?d.balance:d.bal;
  const a=[...list];
  if(strategy==="snowball")a.sort((x,y)=>bal(x)-bal(y)||y.apr-x.apr);
  else a.sort((x,y)=>y.apr-x.apr||bal(x)-bal(y));
  return a;
}
/**
 * Simulate a payoff plan.
 * opts: {debts, strategy, extraMonthly, lumpSums:[{monthIndex,amount}], minimumsOnly, startMk}
 * Returns a full projection. Never loops forever; flags debts that can't be paid off.
 */
function simulate(opts={}){
  const strategy=opts.strategy||S.settings.strategy||"avalanche";
  const extra=Math.max(0,+opts.extraMonthly||0);
  const lumps={}; (opts.lumpSums||[]).forEach(l=>{const i=Math.max(0,+l.monthIndex||0);lumps[i]=(lumps[i]||0)+(+l.amount||0)});
  const src=activeDebts(opts.debts);
  const startMk=opts.startMk||monthKey(new Date());
  if(!src.length)return{months:0,payoffMk:null,payoffDate:null,totalInterest:0,totalPaid:0,order:[],perDebt:{},schedule:[],impossible:[],startBalance:0};
  const sim=src.map(d=>({id:d.id,name:d.name,apr:+d.apr||0,bal:+d.balance||0,
    base:opts.minimumsOnly?(+d.minPayment||0):basePayment(d),min:+d.minPayment||0}));
  const startBalance=sim.reduce((s,d)=>s+d.bal,0);
  const budget=sim.reduce((s,d)=>s+d.base,0)+(opts.minimumsOnly?0:extra);
  const perDebt={};sim.forEach(d=>perDebt[d.id]={interest:0,paid:0,payoffMk:null,months:null});
  // payoff order is decided from the starting balances, before any of them change
  const payoffOrder=orderDebts(sim.map(d=>({id:d.id,balance:d.bal,apr:d.apr})),strategy).map(d=>d.id);
  const schedule=[];let totalInterest=0,totalPaid=0,months=0,stalled=0,prevTotal=startBalance;
  const impossible=[];
  while(sim.some(d=>d.bal>.004)&&months<MAX_MONTHS){
    const mk=shiftMonth(startMk,months);
    let avail=budget+(lumps[months]||0);
    let mInt=0,mPaid=0;
    // 1. accrue interest
    for(const d of sim){ if(d.bal<=.004)continue;
      const i=d.bal*(d.apr/100/12); d.bal+=i; mInt+=i; totalInterest+=i; perDebt[d.id].interest+=i; }
    // 2. base payments
    for(const d of sim){ if(d.bal<=.004||avail<=0)continue;
      const pay=Math.min(d.base,d.bal,avail); d.bal-=pay; avail-=pay; mPaid+=pay;
      totalPaid+=pay; perDebt[d.id].paid+=pay; }
    // 3. surplus poured into strategy order (rollover happens automatically)
    for(const d of orderDebts(sim.filter(x=>x.bal>.004),strategy)){
      if(avail<=0)break;
      const pay=Math.min(d.bal,avail); d.bal-=pay; avail-=pay; mPaid+=pay;
      totalPaid+=pay; perDebt[d.id].paid+=pay;
    }
    months++;
    // 4. record payoffs
    for(const d of sim){ if(d.bal<=.004&&!perDebt[d.id].payoffMk){d.bal=0;perDebt[d.id].payoffMk=mk;perDebt[d.id].months=months} }
    const total=sim.reduce((s,d)=>s+d.bal,0);
    schedule.push({mk,balance:total,interest:mInt,principal:Math.max(0,mPaid-mInt),payment:mPaid});
    // 5. stall detection — payment can't outrun interest
    if(total>=prevTotal-.01){stalled++}else{stalled=0}
    prevTotal=total;
    if(stalled>=3){sim.filter(d=>d.bal>.004).forEach(d=>impossible.push(d.id));break}
  }
  const done=!sim.some(d=>d.bal>.004);
  const payoffMk=done?shiftMonth(startMk,months-1):null;
  return{months:done?months:null,payoffMk,payoffDate:payoffMk?monthName(payoffMk):null,
    totalInterest:Math.round(totalInterest),totalPaid:Math.round(totalPaid),
    order:payoffOrder,perDebt,schedule,impossible:[...new Set(impossible)],startBalance};
}
/** Compare two plans and express the delta in plain terms. */
function compareRuns(a,b){
  return{monthsSaved:(a.months!=null&&b.months!=null)?a.months-b.months:null,
    interestSaved:Math.round(a.totalInterest-b.totalInterest)};
}
const currentPlan=()=>simulate({strategy:S.settings.strategy,extraMonthly:S.settings.extraMonthly});
const minimumsPlan=()=>simulate({minimumsOnly:true,strategy:S.settings.strategy});

/* ---------- portfolio aggregates ---------- */
const totalBalance=()=>S.debts.filter(d=>d.active!==false).reduce((s,d)=>s+(+d.balance||0),0);
const totalOriginal=()=>S.debts.reduce((s,d)=>s+Math.max(+d.originalBalance||0,+d.balance||0),0);
const totalPaidOff=()=>Math.max(0,totalOriginal()-totalBalance());
const percentFree=()=>{const o=totalOriginal();return o?clamp(totalPaidOff()/o*100,0,100):0};
const monthlyCommitment=()=>activeDebts().reduce((s,d)=>s+basePayment(d),0)+(+S.settings.extraMonthly||0);
const paymentsFor=id=>S.payments.filter(p=>p.debtId===id).sort((a,b)=>b.date.localeCompare(a.date));
const paidToward=id=>S.payments.filter(p=>p.debtId===id).reduce((s,p)=>s+(+p.amount||0),0);
function nextDueDate(d){
  if(!d.dueDay)return null;
  const t=new Date();const dim=daysInMonth(monthKey(t));const day=Math.min(+d.dueDay,dim);
  const thisMonth=new Date(t.getFullYear(),t.getMonth(),day);
  if(thisMonth>=new Date(t.getFullYear(),t.getMonth(),t.getDate()))return thisMonth.toISOString().slice(0,10);
  const n=new Date(t.getFullYear(),t.getMonth()+1,Math.min(+d.dueDay,daysInMonth(shiftMonth(monthKey(t),1))));
  return n.toISOString().slice(0,10);
}
const daysUntil=iso=>iso?Math.ceil((new Date(iso+"T12:00:00")-new Date())/864e5):null;
function utilization(d){const lim=+d.creditLimit||0;return lim>0?clamp((+d.balance||0)/lim*100,0,999):null}

/* ---------- milestones ---------- */
const MILES=[
  {id:"first500",name:"First $500 paid",test:()=>totalPaidOff()>=500,desc:"Pay off your first $500"},
  {id:"first1k",name:"$1,000 paid",test:()=>totalPaidOff()>=1000,desc:"Pay off $1,000 of debt"},
  {id:"p10",name:"10% debt-free",test:()=>percentFree()>=10,desc:"Clear a tenth of your debt"},
  {id:"p25",name:"25% debt-free",test:()=>percentFree()>=25,desc:"Clear a quarter of your debt"},
  {id:"p50",name:"Halfway there",test:()=>percentFree()>=50,desc:"Clear half of your debt"},
  {id:"p75",name:"75% debt-free",test:()=>percentFree()>=75,desc:"Clear three quarters"},
  {id:"firstdebt",name:"First debt cleared",test:()=>S.debts.some(d=>(+d.balance||0)<=0),desc:"Pay off a whole debt"},
  {id:"free",name:"DEBT FREE",test:()=>S.debts.length>0&&totalBalance()<=0,desc:"Clear every last balance"}
];
function checkMilestones(){
  let hit=null;
  MILES.forEach(m=>{if(!S.milestones[m.id]&&m.test()){S.milestones[m.id]=todayISO();hit=m}});
  if(hit){toast("Milestone reached",hit.name,"ok");save()}
}
/** Next milestone the user is approaching, with the gap in currency. */
function nextMilestone(){
  const o=totalOriginal();if(!o)return null;
  const paid=totalPaidOff();
  const targets=[{id:"first500",v:500},{id:"first1k",v:1000},{id:"p10",v:o*.1},{id:"p25",v:o*.25},{id:"p50",v:o*.5},{id:"p75",v:o*.75},{id:"free",v:o}];
  for(const t of targets){if(!S.milestones[t.id]&&paid<t.v){const m=MILES.find(x=>x.id===t.id);return{name:m.name,gap:t.v-paid}}}
  return null;
}

/* ---------- demo data ---------- */
function loadDemo(){
  const t=new Date(), mk=monthKey(t), p1=shiftMonth(mk,-1), p2=shiftMonth(mk,-2), p3=shiftMonth(mk,-3);

    balance:bal,originalBalance:orig,apr,minPayment:min,plannedPayment:planned,dueDay,

  S.debts=[

    D("Auto Loan","First Community CU","Auto Loan",11850,19500,6.25,398,398,5),

    P(0,p2,12,205,61,144),P(1,p2,18,70,17,53),P(2,p2,5,398,338,60),P(3,p2,21,210,145,65),P(4,p2,28,95,95,0),
    P(0,p1,12,205,62,143),P(1,p1,18,70,18,52),P(2,p1,5,398,340,58),P(3,p1,21,210,146,64),P(4,p1,28,95,95,0),

  ];

  ];

}

/* ==========================================================
   UI PRIMITIVES
   ========================================================== */
const IC={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',

/* ---------- charts (local canvas, no libraries) ---------- */
function canvasSetup(c,h){const dpr=window.devicePixelRatio||1,w=c.parentElement.clientWidth-2;
  c.width=w*dpr;c.height=h*dpr;c.style.height=h+"px";const x=c.getContext("2d");x.scale(dpr,dpr);return{x,w,h}}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function lineChart(c,labels,data,color,h=210,fill=true){
  const{x,w}=canvasSetup(c,h);const max=Math.max(1,...data)*1.06,min=0;
  const p={l:56,r:12,t:12,b:26},cw=w-p.l-p.r,ch=h-p.t-p.b;
  x.font="11px "+cssv("--f-body");x.strokeStyle=cssv("--border");x.lineWidth=1;
  for(let i=0;i<=4;i++){const y=p.t+ch*(1-i/4);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();
    x.fillStyle=cssv("--ink-3");x.fillText(compact(min+(max-min)*i/4),5,y+3)}
  const pt=i=>[p.l+cw*(data.length===1?.5:i/(data.length-1)),p.t+ch*(1-(data[i]-min)/(max-min))];
  if(fill){x.beginPath();x.moveTo(p.l,p.t+ch);data.forEach((_,i)=>{const[a,b]=pt(i);x.lineTo(a,b)});
    x.lineTo(p.l+cw,p.t+ch);x.closePath();
    const g=x.createLinearGradient(0,p.t,0,p.t+ch);g.addColorStop(0,color+"38");g.addColorStop(1,color+"05");
    x.fillStyle=g;x.fill()}
  x.beginPath();x.strokeStyle=color;x.lineWidth=2.5;x.lineJoin="round";
  data.forEach((_,i)=>{const[a,b]=pt(i);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();
  x.fillStyle=cssv("--ink-3");x.textAlign="center";
  labels.forEach((l,i)=>{if(labels.length>10&&i%Math.ceil(labels.length/8))return;x.fillText(l,pt(i)[0],h-8)});
  x.textAlign="left";
}
function barChart(c,labels,series,colors,h=210){
  const{x,w}=canvasSetup(c,h);const max=Math.max(1,...series.flat());
  const p={l:52,r:10,t:12,b:26},cw=w-p.l-p.r,ch=h-p.t-p.b;
  x.font="11px "+cssv("--f-body");x.strokeStyle=cssv("--border");
  for(let i=0;i<=4;i++){const y=p.t+ch*(1-i/4);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();
    x.fillStyle=cssv("--ink-3");x.fillText(compact(max*i/4),5,y+3)}
  const gw=cw/labels.length,bw=Math.min(24,(gw-10)/series.length);
  labels.forEach((l,i)=>{const x0=p.l+i*gw+(gw-bw*series.length)/2;
    series.forEach((s,si)=>{const v=s[i]||0,bh=v/max*ch;x.fillStyle=colors[si];
      rr(x,x0+si*bw+1,p.t+ch-bh,bw-2,bh,4);x.fill()});
    x.fillStyle=cssv("--ink-3");x.textAlign="center";x.fillText(l,p.l+i*gw+gw/2,h-8);x.textAlign="left"});
}
function donutChart(c,entries,h=200){
  const{x,w}=canvasSetup(c,h);const total=entries.reduce((s,e)=>s+e.value,0)||1;
  const cx=w/2,cy=h/2,r=Math.min(w,h)/2-8,ir=r*.64;let a=-Math.PI/2;
  entries.forEach(e=>{const sw=e.value/total*Math.PI*2;
    x.beginPath();x.moveTo(cx+Math.cos(a)*ir,cy+Math.sin(a)*ir);
    x.arc(cx,cy,r,a,a+sw);x.arc(cx,cy,ir,a+sw,a,true);x.closePath();
    x.fillStyle=e.color;x.fill();x.strokeStyle=cssv("--surface");x.lineWidth=2;x.stroke();a+=sw});
  x.fillStyle=cssv("--ink");x.font="600 19px "+cssv("--f-num");x.textAlign="center";
  x.fillText(compact(total),cx,cy+2);
  x.font="11px "+cssv("--f-body");x.fillStyle=cssv("--ink-3");x.fillText("total",cx,cy+18);x.textAlign="left";
}
function rr(x,a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);
  x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

/* ==========================================================
   DEBT COACH — deterministic rules over stored data only
   ========================================================== */
function coachInsights(){
  const out=[],add=(p,title,body)=>out.push({p,title,body});
  const act=activeDebts();
  if(!act.length){
    if(S.debts.length)add("low","Every balance is cleared","There is nothing left to pay off. Keep the payment habit and redirect it to savings.");
    return out;
  }
  const plan=currentPlan(), mins=minimumsPlan(), diff=compareRuns(mins,plan);
  // impossible payments first — the most actionable warning there is
  plan.impossible.forEach(id=>{const d=S.debts.find(x=>x.id===id);if(d)
    add("high","Payment does not cover interest on "+d.name,
      "At "+fmt(basePayment(d))+" a month against "+(+d.apr).toFixed(2)+"% interest, this balance may never reach zero. Increasing the payment is the only way to make progress.")});
  // overdue / upcoming
  act.forEach(d=>{const due=nextDueDate(d),n=daysUntil(due);
    if(n===null)return;
    if(n<=3)add(n<=1?"high":"med",d.name+" payment due "+(n<=0?"today":"in "+n+" day"+(n>1?"s":"")),
      fmt(basePayment(d))+" is scheduled for "+fmtDate(due)+".")});
  // highest APR
  const hi=[...act].sort((a,b)=>b.apr-a.apr)[0];
  if(hi&&hi.apr>0)add("med","Highest interest rate: "+hi.name,
    hi.name+" charges "+(+hi.apr).toFixed(2)+"%. The avalanche method targets this debt first because it costs the most to carry.");
  // closest to payoff
  const small=[...act].sort((a,b)=>a.balance-b.balance)[0];
  if(small)add("low","Closest to the finish line: "+small.name,
    "Only "+fmt(small.balance)+" remains. Clearing it frees "+fmt(basePayment(small))+" a month to roll into the next debt.");
  // strategy comparison
  const sn=simulate({strategy:"snowball",extraMonthly:S.settings.extraMonthly});
  const av=simulate({strategy:"avalanche",extraMonthly:S.settings.extraMonthly});
  if(sn.months!=null&&av.months!=null){
    const gap=sn.totalInterest-av.totalInterest;
    if(Math.abs(gap)>=25)add("med","Avalanche would save "+fmt(Math.abs(gap))+" in interest",
      "Paying the highest rate first costs "+fmt(Math.abs(gap))+" less than smallest-balance-first. Snowball is still a fine choice if early wins keep you going.");
    else add("low","Both strategies cost about the same here",
      "Snowball and avalanche finish within "+fmt(Math.abs(gap))+" of each other, so pick whichever keeps you motivated.");
  }
  // extra payment opportunity
  if(plan.months!=null){
    const more=simulate({strategy:S.settings.strategy,extraMonthly:(+S.settings.extraMonthly||0)+100});
    if(more.months!=null){const c=compareRuns(plan,more);
      if(c.monthsSaved>0)add("med","An extra "+fmt(100)+" a month is worth "+c.monthsSaved+" month"+(c.monthsSaved>1?"s":""),
        "It would move your projected date to "+more.payoffDate+" and save about "+fmt(c.interestSaved)+" in interest.")}
  }
  if(diff.interestSaved>0&&(+S.settings.extraMonthly||0)>0)
    add("low","Your extra payment is already working","Compared with minimum payments only, your plan saves about "+fmt(diff.interestSaved)+" in interest.");
  // milestone
  const nm=nextMilestone();
  if(nm)add("low","Next milestone: "+nm.name,"You are "+fmt(nm.gap)+" away from it.");
  // credit utilization
  act.forEach(d=>{const u=utilization(d);
    if(u!==null&&u>=70)add("med","High balance on "+d.name,
      "You are using "+u.toFixed(0)+"% of the "+fmt(d.creditLimit)+" limit. Lenders describe this as high utilization.")});
  const rank={high:0,med:1,low:2};
  return out.sort((a,b)=>rank[a.p]-rank[b.p]);
}

    "</div>"+

      '<div class="lg"><span><i style="background:#2A6FB0"></i>Snowball</span><span><i style="background:#0E7A54"></i>Avalanche</span></div></div>';

    const n=Math.max(sn.schedule.length,av.schedule.length);
    const labels=Array.from({length:n},(_,i)=>monthName(shiftMonth(monthKey(new Date()),i)).slice(0,3));
    const{x,w}=canvasSetup(c,240);const max=Math.max(1,totalBalance())*1.05;
    const p={l:56,r:12,t:12,b:26},cw=w-p.l-p.r,ch=240-p.t-p.b;

    for(let i=0;i<=4;i++){const y=p.t+ch*(1-i/4);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();
      x.fillStyle=cssv("--ink-3");x.fillText(compact(max*i/4),5,y+3)}
    [[sn,"#2A6FB0"],[av,"#0E7A54"]].forEach(([r,col])=>{
      x.beginPath();x.strokeStyle=col;x.lineWidth=2.5;
      r.schedule.forEach((m,i)=>{const a=p.l+cw*(i/Math.max(1,n-1)),b=p.t+ch*(1-m.balance/max);i?x.lineTo(a,b):x.moveTo(a,b)});
      x.stroke()});
    x.fillStyle=cssv("--ink-3");x.textAlign="center";
    labels.forEach((l,i)=>{if(i%Math.ceil(n/8))return;x.fillText(l,p.l+cw*(i/Math.max(1,n-1)),232)});x.textAlign="left"}
}

/* ---------- Payment Calendar ---------- */
let calMk=monthKey(new Date());
function pgCalendar(){
  const el=$("#p-calendar");const[y,m]=calMk.split("-").map(Number);
  const dim=daysInMonth(calMk),first=new Date(y,m-1,1),ws=S.settings.weekStart;
  const dows=ws===1?["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const lead=(first.getDay()-ws+7)%7,today=new Date(),isCur=calMk===monthKey(today);
  const evs={};
  activeDebts().forEach(d=>{if(!d.dueDay)return;const day=Math.min(+d.dueDay,dim);
    const iso=calMk+"-"+String(day).padStart(2,"0");
    const paid=S.payments.some(p=>p.debtId===d.id&&p.date.slice(0,7)===calMk);
    const n=isCur?day-today.getDate():(calMk<monthKey(today)?-1:99);
    const cls=paid?"ev-pd":n<0?"ev-du":n<=7?"ev-so":"ev-du";
    (evs[day]=evs[day]||[]).push('<div class="ev '+cls+'" onclick="openPaymentModal(null,\''+d.id+'\')" title="'+esc(d.name)+' · '+fmt(basePayment(d))+'">'+(paid?"✓ ":"")+esc(d.name)+"</div>")});
  S.payments.filter(p=>p.date.slice(0,7)===calMk).forEach(p=>{const day=+p.date.slice(8,10);
    const d=S.debts.find(x=>x.id===p.debtId);
    (evs[day]=evs[day]||[]).push('<div class="ev ev-pd" onclick="go(\'payments\')" title="Paid '+fmt(p.amount)+'">'+fmt(p.amount)+" paid</div>")});
  let cells="";for(let i=0;i<lead;i++)cells+='<div class="day oth"></div>';
  for(let d=1;d<=dim;d++)cells+='<div class="day '+(isCur&&d===today.getDate()?"tdy":"")+'"><div class="dn">'+d+"</div>"+((evs[d]||[]).join(""))+"</div>";
  el.innerHTML=head("Payment Calendar","Due dates and payments for "+monthName(calMk),
      '<button class="btn btn-g" onclick="calMk=shiftMonth(calMk,-1);render()">Previous</button>'+
      '<button class="btn btn-g" onclick="calMk=monthKey(new Date());render()">This month</button>'+
      '<button class="btn btn-g" onclick="calMk=shiftMonth(calMk,1);render()">Next</button>'+
      '<button class="btn btn-p" onclick="openPaymentModal()">'+IC.plus+"Record payment</button>")+
    '<div class="card"><div class="lg" style="margin:0 0 12px"><span><i style="background:var(--danger)"></i>Due</span>'+
      '<span><i style="background:var(--warn)"></i>Due soon</span><span><i style="background:var(--ok)"></i>Paid</span></div>'+
      '<div class="cal">'+dows.map(d=>'<div class="dow">'+d+"</div>").join("")+cells+"</div></div>";
}

function delPayment(id){const p=S.payments.find(x=>x.id===id);if(!p)return;
  confirmDialog("Delete payment","Remove the "+fmt(p.amount)+" payment from "+fmtDate(p.date)+"? The debt balance is not changed back automatically.",()=>{
    S.payments=S.payments.filter(x=>x.id!==id);save();render();toast("Payment deleted","","if")})}

/* ---------- Progress ---------- */
function pgProgress(){
  const el=$("#p-progress");
  const months=[...new Set(S.payments.map(p=>p.date.slice(0,7)))].sort();
  const paidByMonth=months.map(m=>S.payments.filter(p=>p.date.slice(0,7)===m).reduce((s,p)=>s+(+p.amount||0),0));
  const prinByMonth=months.map(m=>S.payments.filter(p=>p.date.slice(0,7)===m).reduce((s,p)=>s+(+p.principal||0),0));
  const intByMonth=months.map(m=>S.payments.filter(p=>p.date.slice(0,7)===m).reduce((s,p)=>s+(+p.interest||0),0));
  // reconstruct balance history backwards from today using recorded principal
  const hist=[],labels=[];
  let bal=totalBalance();
  for(let i=months.length-1;i>=0;i--){hist.unshift(Math.round(bal));labels.unshift(monthName(months[i]).slice(0,3));bal+=prinByMonth[i]}
  const plan=currentPlan();
  el.innerHTML=head("Progress","How far you have come, measured from real payments","")+
    '<div class="g g4">'+
      stat("Debt-free",percentFree().toFixed(0)+"%",fmt(Math.round(totalPaidOff()))+" cleared","#15A05F","check")+
      stat("Remaining",fmt(Math.round(totalBalance())),activeDebts().length+" debts left","#D2453C","card")+
      stat("Total paid in",fmt(Math.round(S.payments.reduce((s,p)=>s+(+p.amount||0),0))),S.payments.length+" payments","#2A6FB0","coin")+
      stat("Months tracked",String(months.length),months.length?monthName(months[0])+" onward":"record a payment to start","#5B6B7A","cal")+
    "</div>"+
    '<div class="card" style="margin-top:16px"><div class="ct"><h3>Debt-free progress</h3><span class="bg bg-ok">'+percentFree().toFixed(1)+"%</span></div>"+
      '<div class="pr" style="height:14px"><div style="width:'+percentFree()+'%"></div></div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:8px" class="mu"><span>'+fmt(totalPaidOff())+" paid</span><span>"+fmt(totalOriginal())+" original</span></div></div>"+
    '<div class="g g2" style="margin-top:16px">'+
      '<div class="card"><div class="ct"><h3>Balance trend</h3></div>'+
        (hist.length>1?'<canvas id="prTrend" class="cv"></canvas>':'<p class="mu" style="padding:24px 0;text-align:center">Record payments across two or more months to see the trend.</p>')+"</div>"+
      '<div class="card"><div class="ct"><h3>Principal vs interest paid</h3></div>'+
        (months.length?'<canvas id="prSplit" class="cv"></canvas><div class="lg"><span><i style="background:#0E7A54"></i>Principal</span><span><i style="background:#E09B2D"></i>Interest</span></div>':'<p class="mu" style="padding:24px 0;text-align:center">No payments recorded yet.</p>')+"</div>"+
    "</div>"+
    '<div class="card" style="margin-top:16px"><div class="ct"><h3>Progress by debt</h3></div>'+
      (S.debts.length?S.debts.map(d=>{const orig=Math.max(+d.originalBalance||0,+d.balance||0);
        const pct=orig?clamp((1-(+d.balance||0)/orig)*100,0,100):0;
        return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px">'+
          "<b>"+esc(d.name)+'</b><span class="mu num">'+fmt(d.balance)+" of "+fmt(orig)+"</span></div>"+
          '<div class="pr '+((+d.balance||0)<=0?"":"rd")+'"><div style="width:'+pct+'%"></div></div></div>'}).join("")
        :'<p class="mu">No debts yet.</p>')+"</div>";
  if(hist.length>1)lineChart($("#prTrend"),labels,hist,"#0E7A54",210);
  if(months.length)barChart($("#prSplit"),months.map(m=>monthName(m).slice(0,3)),[prinByMonth.map(Math.round),intByMonth.map(Math.round)],["#0E7A54","#E09B2D"],210);
}

/* ---------- Debt Coach ---------- */
function pgCoach(){
  const el=$("#p-coach");const ins=coachInsights();

      '<div class="g g2">'+
        "<div><h4 style='font-family:var(--f-display);font-size:16px;margin-bottom:9px'>This month</h4>"+
        "<div style='font-size:13.5px;line-height:1.95'>"+

const DISCLAIMER="Debt payoff calculations are estimates based on the information you enter and the assumptions used by this application. Actual interest, payment allocation, fees and payoff dates may vary by lender. DebtFreeOS is an organisational and educational tool and is not financial, legal, tax or investment advice.";

    '<div class="g g2">'+

function resetApp(){
  confirmDialog("Reset everything?","This permanently erases all debts, payments, scenarios and milestones on this device. Export a backup first if you might want them back.",
    async()=>{S=blank();await persist();applyTheme();go("dashboard");toast("Everything reset","A clean slate.","if")},"Erase all data")}

/* ---------- PUBLIC DEMO: HARD READ-ONLY GUARD ---------- */
function readonlyProxy(value){
  if(!value || typeof value!=="object") return value;
  return new Proxy(value,{get(target,key){return readonlyProxy(Reflect.get(target,key))},set(){return true},deleteProperty(){return true},defineProperty(){return true}});
}
function lockDemoState(){S=readonlyProxy(S)}
const DEMO_MUTATOR_CALLS=/\b(openDebtModal|deleteDebt|openPaymentModal|delPayment|openScenarioModal|delScenario|dupScenario|applyScenario|saveScenarioFromWhatIf|startFresh|resetApp)\s*\(/;
const DEMO_MUTATOR_WORDS=/^(add|save|create|record|delete|remove|apply|erase|reset|edit)/i;
document.addEventListener("click",function(e){
  if(!DEMO_MODE)return;
  const b=e.target.closest("button"); if(!b)return;
  const code=b.getAttribute("onclick")||"", label=(b.textContent||"").trim();
  if(DEMO_MUTATOR_CALLS.test(code) || (b.closest("#mf") && DEMO_MUTATOR_WORDS.test(label))){
    e.preventDefault();e.stopImmediatePropagation();
    toast("Demo mode","Adding, editing and deleting records are disabled. You can explore the sample data freely.","if");
  }
},true);

/* ---------- boot ---------- */
(async function boot(){
  await loadState();
  loadDemo();
  lockDemoState();
  applyTheme();
  render();
  window.addEventListener("resize",debounce(()=>render(),220));
})();
</script>
